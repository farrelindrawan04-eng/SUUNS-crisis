services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suuns
      POSTGRES_USER: suuns
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - suuns-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suuns -d suuns"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/suuns
      DATABASE_USERNAME: suuns
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      CLEC_MASTER_USERNAME: ${CLEC_MASTER_USERNAME:?Set CLEC_MASTER_USERNAME}
      CLEC_MASTER_PASSWORD: ${CLEC_MASTER_PASSWORD:?Set CLEC_MASTER_PASSWORD}
      CLEC_MASTER_DISPLAY_NAME: ${CLEC_MASTER_DISPLAY_NAME:?Set CLEC_MASTER_DISPLAY_NAME}
      CLEC_ALLOWED_ORIGIN: ${CLEC_ALLOWED_ORIGIN:-http://localhost:8088}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${SUUNS_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  suuns-postgres:
