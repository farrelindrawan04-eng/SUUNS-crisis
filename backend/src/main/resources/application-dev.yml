spring:
  datasource:
    url: jdbc:h2:file:./data/clec;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

clec:
  auth:
    master:
      username: ${CLEC_MASTER_USERNAME:master}
      password: ${CLEC_MASTER_PASSWORD:master-change-me}
      display-name: ${CLEC_MASTER_DISPLAY_NAME:Master Controller}
